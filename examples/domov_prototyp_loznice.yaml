# =============================================================================
# Klima Dashboard – kompletní konfigurace jedné karty (CURRENT_SPEC.md, Konfigurace)
#
# Jsou tu VŠECHNA nastavení. Hodnoty jsou výchozí, stačí přepsat číslo nebo text.
# Klíč bez hodnoty (např. "link:") nebo smazaný klíč = výchozí hodnota.
# Nejdřív je společné nastavení pro celý dům, pod ním místnosti.
# Karta mluví česky, švédsky nebo anglicky (language). Texty odsud (nadpis, názvy
# místností, oken a předvoleb; title, name a description) jsou text, nebo podle jazyka
# {cs: Ložnice, en: Bedroom, sv: Sovrum}: vybere se jazyk karty, pak angličtina, pak
# první uvedený. Prázdné = výchozí v jazyce karty.
# =============================================================================
type: custom:ha-klima-dashboard

# -----------------------------------------------------------------------------
# 1. SPOLEČNÉ NASTAVENÍ PRO CELÝ DŮM (platí pro všechny místnosti)
# -----------------------------------------------------------------------------
title: {cs: Domov prototyp, en: Home prototype, sv: Hem prototyp}   # nadpis karty: text, nebo podle jazyka; "" ho vynechá; bez hodnoty „Domov“ v jazyce karty
theme: auto                     # barvy: auto (podle Home Assistantu / Vzhledu iPhonu), dark, light
language: auto                  # jazyk: auto (podle Home Assistantu: čeština, švédština, jinak angličtina), cs, sv, en

# Režim domu: Zima / Léto (pořadí Topení a Klimatizace, komfortní pásmo).
house_mode_entity: input_select.house_mode
house_modes:
  winter: Zima                  # hodnota pro zimu (velikost písmen a diakritika nerozhodují)
  summer: Léto                  # hodnota pro léto

# Větrací režim: štítek v souhrnu domu a popup s dobou běhu a ukončením. Bez klíče se nezobrazuje.
ventilation_entity: input_boolean.ventilation_mode    # entita režimu (zapnuto = štítek)
ventilation_timer_entity: timer.ventilation_mode      # časovač režimu (konec nejpozději); bez klíče řádek konce zmizí
ventilation_co2_target: 450                         # cíl CO₂ (ppm): při něm nebo pod ním lze zavřít okna

# Venkovní podmínky v hlavičce. Teplota je z OpenWeatherMap; ostatní entity v domě nejsou, proto prázdné.
outside:
  temperature: sensor.openweathermap_temperature   # aktuální venkovní teplota
  minimum:                      # denní minimum
  maximum:                      # denní maximum
  rain_probability:             # pravděpodobnost deště (%)
  pm25:                         # venkovní PM2.5 (µg/m³)

# Prahy (místnost je může přepsat vlastním "thresholds" níže).
thresholds:
  humidity_min: 35              # Sucho pod (%)
  humidity_max: 70              # Vlhko nad (%)
  co2_warning: 1000             # CO₂: Vydýchaný vzduch od (ppm), oranžové číslo
  co2_critical: 1500            # CO₂: Silně vydýchaný vzduch od (ppm), červené číslo
  pm25_warning: 15              # PM2.5: oranžové číslo od (µg/m³); i venkovní vzduch
  pm25_critical: 35             # PM2.5: Znečištěný vzduch od (µg/m³)
  winter_min: 20                # komfortní teplota v zimě od (°C), níž Chladno
  winter_max: 24                # komfortní teplota v zimě do (°C), výš Teplo
  summer_min: 21                # komfortní teplota v létě od (°C)
  summer_max: 25                # komfortní teplota v létě do (°C)
  stale_minutes: 30             # měření starší než tolik minut je šedé a chybí ve stavu
  heating_waves_2: 35           # intenzita vytápění od (%) = dvě vlny (jedna vlna = cokoli nad 0 %)
  heating_waves_3: 68           # intenzita vytápění od (%) = tři vlny

# Mikrotrendy CO₂, PM2.5 a teploty.
trends:
  minutes: 120                  # zobrazený úsek mikrotrendu (10–1440 min)
  samples: 12                   # počet bodů (2–120)
  temperature_step: 1           # krok společné osy teploty (°C); polovina = práh „stoupá / klesá“
  co2_step: 100                 # krok osy CO₂ (ppm)
  pm25_step: 5                  # krok osy PM2.5 (µg/m³)

# Popup Historie místnosti (klepnutí na teplotu).
history:
  hours: 24                     # délka období (1–168 h)
  night_start: 22               # ztmavená noc v grafu od (hodina)
  night_end: 6                  # do (hodina)
  min_temperature_span: 1.5     # nejmenší rozsah osy teploty (°C)

# Žaluzie (místnost může předvolby přepsat vlastním "cover_presets" níže).
covers:
  script: script.zaluzie_posun  # skript předvoleb s poli entity, pos, tilt
  tolerance: 5                  # ± % pro shodu žaluzie s předvolbou
  stall_seconds: 5              # pulzování předvolby skončí po tolika sekundách beze změny
  presets:                      # 1–3 tlačítka shora dolů; icon: open (Den) | shade (Stín) | dark (Tma)
    - name: {cs: Den, en: Day, sv: Dag}   # text, nebo podle jazyka; prázdné = podle ikony v jazyce karty (Den / Day / Dag)
      icon: open
      position: 100             # poloha: 0 = dole, 100 = nahoře
      tilt: 100                 # naklopení: 0 = lamely zavřené, 100 = otevřené
      description: {cs: vytaženo nahoru, en: raised, sv: uppdragen}   # pro čtečku obrazovky (text, nebo podle jazyka); prázdné = text podle ikony v jazyce karty
    - name: {cs: Stín, en: Shade, sv: Skugga}
      icon: shade
      position: 0
      tilt: 100
      description: {cs: "spuštěno, lamely otevřené", en: "lowered, slats open", sv: "nerdragen, lamellerna öppna"}
    - name: {cs: Tma, en: Dark, sv: Mörker}
      icon: dark
      position: 0
      tilt: 0
      description: {cs: úplné zatemnění, en: full blackout, sv: full mörkläggning}

# -----------------------------------------------------------------------------
# 2. MÍSTNOSTI (v tomto pořadí na kartě)
#   image: bedroom | office | kids | living | none, nebo adresa vlastního obrázku
#          (/local/klima/loznice.jpg = soubor /config/www/klima/loznice.jpg)
#   link: klepnutí na název místnosti otevře stránku (/lovelace/loznice) nebo https://…
#   carbon_dioxide / pm25: entita čidla; false = místnost čidlo nemá (řádek zmizí,
#          stav místnosti ho nepotřebuje); prázdné = čidlo zatím chybí („Bez dat“)
#   window: seznam oken (jedno i více); name se ukáže v popupu Okna
#          (bez name „Okno 1“, „Okno 2“ v jazyce karty)
#   cover_presets: prázdné = společné covers.presets; vlastní seznam jako tam
#   thresholds: prázdné = společné prahy; jen odchylky, např. winter_min: 19
# -----------------------------------------------------------------------------
rooms:
  - name: {cs: Ložnice, en: Bedroom, sv: Sovrum}   # název místnosti: text, nebo podle jazyka (první uvedený je identita místnosti)
    image: bedroom
    link:
    temperature: sensor.loznice_teplomer_loznice_temperature
    humidity: sensor.loznice_teplomer_loznice_humidity
    carbon_dioxide: sensor.loznice_teplomer_loznice_carbon_dioxide
    pm25: sensor.loznice_teplomer_loznice_pm2_5
    window:
      - entity: binary_sensor.loznice_okno_loznice
        name: {cs: Okno, en: Window, sv: Fönster}
    cover: cover.loznice_zaluzie_loznice
    cover_presets:
    thresholds:
    heating:
      climate: climate.loznice_tado_ce_loznice
      overlay: sensor.loznice_tado_ce_loznice_overlay
      target: sensor.loznice_tado_ce_loznice_target
      intensity: sensor.loznice_tado_ce_loznice_heating
    air_conditioner: climate.loznice_ac_loznice

  - name: {cs: Pracovna, en: Study, sv: Arbetsrum}
    image: office
    link:
    temperature: sensor.pracovna_teplomer_pracovna_temperature
    humidity: sensor.pracovna_teplomer_pracovna_humidity
    carbon_dioxide: sensor.pracovna_teplomer_pracovna_carbon_dioxide
    pm25: sensor.pracovna_teplomer_pracovna_pm2_5
    window:
      - entity: binary_sensor.pracovna_okno_pracovna
        name: {cs: Okno, en: Window, sv: Fönster}
    cover: cover.pracovna_zaluzie_pracovna
    cover_presets:
    thresholds:
    heating:
      climate: climate.pracovna_tado_ce_pracovna
      overlay: sensor.pracovna_tado_ce_pracovna_overlay
      target: sensor.pracovna_tado_ce_pracovna_target
      intensity: sensor.pracovna_tado_ce_pracovna_heating
    air_conditioner: climate.pracovna_ac_pracovna

  - name: {cs: Maxík, en: Maxík, sv: Maxík}
    image: kids
    link:
    temperature: sensor.maxik_teplomer_maxik_temperature
    humidity: sensor.maxik_teplomer_maxik_humidity
    carbon_dioxide: sensor.maxik_teplomer_maxik_carbon_dioxide
    pm25: sensor.maxik_teplomer_maxik_pm2_5
    window:
      - entity: binary_sensor.maxik_okno_maxik
        name: {cs: Okno, en: Window, sv: Fönster}
    cover: cover.maxik_zaluzie_maxik
    cover_presets:
    thresholds:
    heating:
      climate: climate.maxik_tado_ce_maxik
      overlay: sensor.maxik_tado_ce_maxik_overlay
      target: sensor.maxik_tado_ce_maxik_target
      intensity: sensor.maxik_tado_ce_maxik_heating
    air_conditioner: climate.maxik_ac_maxik

  - name: {cs: Mikuláš, en: Mikuláš, sv: Mikuláš}
    image: kids
    link:
    temperature: sensor.mikulas_teplomer_mikulas_temperature
    humidity: sensor.mikulas_teplomer_mikulas_humidity
    carbon_dioxide: sensor.mikulas_teplomer_mikulas_carbon_dioxide
    pm25: sensor.mikulas_teplomer_mikulas_pm2_5
    window:
      - entity: binary_sensor.mikulas_okno_mikulas
        name: {cs: Okno, en: Window, sv: Fönster}
    cover: cover.mikulas_zaluzie_mikulas
    cover_presets:
    thresholds:
    heating:
      climate: climate.mikulas_tado_ce_mikulas
      overlay: sensor.mikulas_tado_ce_mikulas_overlay
      target: sensor.mikulas_tado_ce_mikulas_target
      intensity: sensor.mikulas_tado_ce_mikulas_heating
    air_conditioner: climate.mikulas_ac_mikulas

  - name: {cs: Obývák, en: Living room, sv: Vardagsrum}
    image: living
    link:
    temperature: sensor.obyvak_teplomer_obyvak_temperature
    humidity: sensor.obyvak_teplomer_obyvak_humidity
    carbon_dioxide: sensor.obyvak_teplomer_obyvak_carbon_dioxide
    pm25: sensor.obyvak_teplomer_obyvak_pm2_5
    window:
      - entity: binary_sensor.obyvak_dvere_zahrada
        name: {cs: Dveře na zahradu, en: Garden door, sv: Trädgårdsdörr}
    cover:                          # Obývák žaluzie nemá
    cover_presets:
    thresholds:
    heating:
      climate: climate.obyvak_tado_ce_obyvak
      overlay: sensor.obyvak_tado_ce_obyvak_overlay
      target: sensor.obyvak_tado_ce_obyvak_target
      intensity: sensor.obyvak_tado_ce_obyvak_heating
    air_conditioner: climate.obyvak_ac_obyvak
